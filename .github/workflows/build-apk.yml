name: Loadout — Unpack, Build, Release and Update Description

on:
  push:
    paths:
      - 'Loadout-GitHub-Build.zip'
      - 'payload/**'
      - 'BUILD_PLAN.json'
      - 'scripts/build.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loadout-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Unpack source bundle and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore stable debug signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.LOADOUT_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable debug signing key restored."
          else
            echo "No LOADOUT_DEBUG_KEYSTORE_B64 secret set; this run will use a temporary runner key."
          fi

      - name: Unpack uploaded ZIP and normalize repository
        shell: bash
        run: |
          set -euo pipefail
          UPLOAD="Loadout-GitHub-Build.zip"
          if [ -f "$UPLOAD" ]; then
            TMP="$RUNNER_TEMP/loadout-import"
            rm -rf "$TMP"
            mkdir -p "$TMP/outer" "$TMP/app"
            unzip -q "$UPLOAD" -d "$TMP/outer"

            PLAN="$(find "$TMP/outer" -maxdepth 4 -name BUILD_PLAN.json -print -quit)"
            if [ -z "$PLAN" ]; then
              echo "BUILD_PLAN.json not found. Upload the complete Loadout-GitHub-Build.zip bundle."
              exit 1
            fi
            BUNDLE="$(dirname "$PLAN")"
            test -f "$BUNDLE/scripts/build.mjs"
            test -f "$BUNDLE/payload/loadout-app-payload.zip"
            test -f "$BUNDLE/payload/SHA256SUMS.txt"

            echo "Verifying nested application payload..."
            (cd "$BUNDLE/payload" && sha256sum -c SHA256SUMS.txt)

            # Unpack the outer build bundle into the repository, but keep this
            # bootstrap workflow in place. It is the persistent one-ZIP entry point.
            rsync -a \
              --exclude='.github/' \
              --exclude='.git/' \
              --exclude='.build/' \
              "$BUNDLE/" "$GITHUB_WORKSPACE/"

            # Also materialize the actual application source at repository root:
            # www/, package.json, Capacitor config, native source and deep instructions.
            unzip -q "$GITHUB_WORKSPACE/payload/loadout-app-payload.zip" -d "$TMP/app"
            APP_SOURCE="$TMP/app/loadout-app"
            test -f "$APP_SOURCE/package.json"
            test -f "$APP_SOURCE/capacitor.config.json"
            test -d "$APP_SOURCE/www"
            rsync -a \
              --exclude='.github/' \
              --exclude='.git/' \
              --exclude='README.md' \
              --exclude='.gitignore' \
              "$APP_SOURCE/" "$GITHUB_WORKSPACE/"

            # Remove the uploaded ZIP only after both layers have been verified
            # and unpacked. The normalized source + payload remain in the repo.
            rm -f "$UPLOAD"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Unpack Loadout build bundle and normalize source"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            else
              echo "Unpack produced no repository changes."
            fi
          else
            echo "No upload ZIP found; building the already-normalized repository."
          fi

          test -f scripts/build.mjs || { echo "scripts/build.mjs missing"; exit 1; }
          test -f BUILD_PLAN.json || { echo "BUILD_PLAN.json missing"; exit 1; }
          test -f payload/loadout-app-payload.zip || { echo "Nested application payload missing"; exit 1; }

      - name: Build debug APK from deep instructions
        run: node scripts/build.mjs

      - name: Prepare stable release asset name
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find .build/loadout-app/android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle finished without producing a debug APK."
            exit 1
          fi
          cp "$APK" Loadout-Android.apk
          sha256sum Loadout-Android.apk | tee Loadout-Android.apk.sha256

      - name: Publish release and upload latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: loadout-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Loadout Android build ${{ github.run_number }}.${{ github.run_attempt }}
          body: |
            Automatically built from the normalized Loadout repository.

            Commit: ${{ github.sha }}
            Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Install `Loadout-Android.apk` on the device. This is a debug build.
          files: |
            Loadout-Android.apk
            Loadout-Android.apk.sha256
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Loadout-Android-debug-apk
          path: |
            Loadout-Android.apk
            Loadout-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Check repository metadata token availability
        id: metadata-token
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -n "$REPO_ADMIN_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update repository description with stable APK download link
        if: ${{ steps.metadata-token.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/Loadout-Android.apk
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description // ""')"
          NEW_DESCRIPTION="$(python - "$CURRENT" "$APK_URL" <<'PY'
          import re, sys
          current = sys.argv[1].strip()
          url = sys.argv[2].strip()
          current = re.sub(r'\s*[|·-]\s*Latest APK:.*$', '', current, flags=re.I).strip()
          suffix = f' | Latest APK: {url}'
          max_len = 350
          prefix = current[:max(0, max_len - len(suffix))].rstrip()
          print(prefix + suffix)
          PY
          )"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -H "Accept: application/vnd.github+json" \
            -f description="$NEW_DESCRIPTION" \
            -f homepage="$APK_URL"
          echo "Repository description and homepage now point to: $APK_URL"

      - name: Explain missing repository-description permission
        if: ${{ steps.metadata-token.outputs.available != 'true' }}
        run: |
          echo "::warning::APK release succeeded, but repository description was not changed. Add the REPO_ADMIN_TOKEN Actions secret with fine-grained Administration: write permission for this repository, then run this workflow again."

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loadout-build-diagnostics
          path: |
            .build/loadout-app/BUILD_INFO.json
            .build/loadout-app/android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
          
